<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login-styles.css">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <div class="form">
                <h2>Login</h2>
                <form id="loginForm" action="login.php" method="POST">
                    <select name="user_type" id="userType" required>
                        <option value="" disabled selected>Select User Type</option>
                        <option value="student">Student</option>
                        <option value="admin">Admin</option>
                        <option value="college_management">College Management</option>
                    </select>
                    <input type="email" name="email" id="username" placeholder="Username or Email" required>
                    <input type="password" name="password" id="password" placeholder="Password" required>
                    <button type="submit">Login</button>
                    <p><a href="resister.html" class="register-link">New Register</a></p>
                </form>
            </div>
        </div>
    </div>

    <script src="login-script.js"></script>
</body>
</html>
